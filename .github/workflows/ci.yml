name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Run pinned Hermes native integration (installs host dependencies)
        type: boolean
        default: false

permissions:
  contents: read

# Event bodies/titles are never interpolated into shell commands. Only fixed
# matrices and a typed boolean input choose jobs; all actions/host source are pinned.

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - if: runner.os != 'Windows'
        run: python -m pytest tests/ -q -m 'not native and not browser'
      - if: runner.os == 'Windows'
        # Optional browser file-URI/symlink security tests are POSIX-specific;
        # the Linux browser job runs them with an actual installed browser.
        run: python -m pytest tests/ -q -m 'not native and not browser' --ignore=tests/test_browser.py
      - run: python -m build

  browser:
    name: Installed Chromium evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HARDLIGHT_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,browser]'
      # CI explicitly installs Chromium; the plugin never installs a browser.
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py tests/test_examples.py -q --junitxml="$RUNNER_TEMP/hardlight-browser.xml"
      # Browser evidence must execute: unavailable Chrome/dependencies cannot be a green skip.
      - name: Require executed interactive browser checks
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # Parse only the local JUnit report just generated by pytest, never supplied XML.
          cases = list(ET.parse(Path(os.environ['RUNNER_TEMP']) / 'hardlight-browser.xml').iter('testcase'))
          assert any('ChromeExamplesTests' in case.get('classname', '') for case in cases), 'Interactive browser tests were not collected'
          skipped = [case.get('name') for case in cases if case.find('skipped') is not None]
          assert not skipped, f'Browser checks must execute, not skip: {skipped}'
          PY

  native:
    name: Explicit pinned Hermes native integration
    if: github.event_name == 'workflow_dispatch' && inputs.native
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: fcace146e9ec62a6455b5a0894f55e5298574903
          path: hermes-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # This host declares runtime dependencies only on Python >=3.14.
          python-version: '3.14'
      - run: python -m pip install -e ./hermes-source -e '.[dev]'
      - run: python -m pytest tests/test_registration.py -q -m native
        env:
          HERMES_SOURCE: ${{ github.workspace }}/hermes-source
